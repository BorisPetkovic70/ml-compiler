name: tests

# quoted: generic YAML 1.1 parsers read a bare `on:` key as the boolean True
"on":
  push:
  pull_request:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab, no commit needed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        run: |
          python -m pytest --cov=hc_dialect --cov=middle_end --cov=back_end \
            --cov=simulator --cov-report=term-missing --cov-fail-under=80 -q
